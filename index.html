<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>糸島夏休み明けプロジェクト2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #E9F7FF;
      --ink: #2F4668;
      --accent: #5C8EDC;
    }
    body{
      margin:0; font-family:'Noto Sans JP', sans-serif;
      background:var(--bg); color:var(--ink);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      -webkit-font-smoothing:antialiased;
    }
    h1{
      font-family:'Hina Mincho', serif;
      font-size:clamp(32px, 6vw, 64px);
      line-height:1.3; text-align:center; margin:24px;
    }
    h1 .highlight{ color:var(--accent); }
  </style>
</head>
<body>
  <h1>糸島<br><span class="highlight">夏休み明け</span><br>プロジェクト2026</h1>
</body>
</html>
